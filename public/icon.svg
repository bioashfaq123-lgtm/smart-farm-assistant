<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Sun Rays & Circle -->
  <circle cx="370" cy="140" r="48" fill="url(#sun)" opacity="0.9" />

  <!-- Plant Stem and Leaves -->
  <path d="M256 420 V 220" stroke="#86efac" stroke-width="20" stroke-linecap="round" />
  
  <!-- Right Leaf -->
  <path d="M256 280 C 330 250 370 190 380 140 C 320 140 270 200 256 280 Z" fill="url(#leaf)" />
  
  <!-- Left Leaf -->
  <path d="M256 230 C 180 200 140 140 130 90 C 190 90 240 150 256 230 Z" fill="url(#leaf)" />

  <!-- Farm furrow curves at bottom -->
  <path d="M70 420 Q 256 380 442 420" stroke="#ca8a04" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.8" />
  <path d="M100 450 Q 256 410 412 450" stroke="#ca8a04" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.6" />
</svg>
